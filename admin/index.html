<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo/El-Maghrib-logos-black.png" />
    <!-- <link href="/src/index.css" rel="stylesheet"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Elmaghrib</title>
    <meta name="description" content="Manage your e-commerce store with our powerful admin panel. Products, orders, and users management made easy." />
    <meta name="author" content="Admin Panel" />

    <meta property="og:title" content="Admin Panel - Elmaghrib" />
    <meta property="og:description" content="Manage your e-commerce store with our powerful admin panel." />
    <meta property="og:type" content="website" />

    <!--
      Bundle-failure detector. Must stay ABOVE the module script Vite injects.
      If any same-origin JS/CSS file fails to load, replace "Loading…" in the
      fallback shell with an explanation. Capture phase: load errors don't bubble.
      The timer covers JS that loads but crashes before React mounts.
    -->
    <script>
      (function () {
        function showDown() {
          var m = document.getElementById('fb-msg');
          if (m) m.textContent = "The admin panel couldn't load its files. The site may be mid-deployment, or the build files are missing from the server. Try a hard refresh (Ctrl+F5) in a minute.";
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          var url = t.src || t.href || '';
          if (url.indexOf(location.origin) === 0) showDown();
        }, true);
        window.addEventListener('load', function () {
          setTimeout(function () { if (document.getElementById('fb-shell')) showDown(); }, 8000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root" style="width: 100%; height: 100vh;">
      <!--
        Static fallback shell: visible while loading and if the JS bundles fail.
        React replaces everything in #root on first render. Self-contained: no /assets requests.
      -->
      <div id="fb-shell">
        <style>
          #fb-shell{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#222;min-height:100vh;display:flex;background:#f5f6f8}
          #fb-shell .fb-side{width:240px;flex-shrink:0;background:#202836;color:#fff;padding:24px 20px}
          #fb-shell .fb-logo{font:700 20px/1.2 Georgia,"Times New Roman",serif;letter-spacing:3px;margin-bottom:28px}
          #fb-shell .fb-side div.fb-item{padding:10px 0;color:#9aa4b2;font-size:14px;border-bottom:1px solid #2e3848}
          #fb-shell .fb-main{flex:1;display:grid;place-items:center;padding:32px 16px;text-align:center}
          #fb-shell .fb-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:32px 28px;max-width:460px}
          #fb-shell h1{font-size:20px;margin:0 0 10px}
          #fb-shell p{margin:0 0 16px;color:#555;line-height:1.5}
          #fb-shell a{color:#1f6feb}
          @media (max-width:640px){#fb-shell{flex-direction:column}#fb-shell .fb-side{width:auto}#fb-shell .fb-side div.fb-item{display:none}}
        </style>
        <aside class="fb-side">
          <div class="fb-logo">EL MAGHRIB</div>
          <div class="fb-item">Dashboard</div>
          <div class="fb-item">Products</div>
          <div class="fb-item">Orders</div>
          <div class="fb-item">Users</div>
        </aside>
        <main class="fb-main">
          <div class="fb-card">
            <h1>Admin Panel</h1>
            <p id="fb-msg">Loading…</p>
            <a href="https://elmaghrib.com">Go to the storefront</a>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
